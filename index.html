<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07140d"><title>Fex Cricket — Pakistan vs India Demo</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><header><div><b>FEX CRICKET</b><small>PLAYABLE DEMO 0.1</small></div><button id="restart">↻ NEW MATCH</button></header>
<section id="score"><div><span>PAKISTAN</span><strong id="runs">0/0</strong></div><div class="overs"><small>OVERS</small><b id="overs">0.0</b></div><div><span>INDIA</span><strong>—</strong></div></section>
<section id="scene"><div class="sky"></div><div class="stands"><i>🏟️</i><i>🏟️</i><i>🏟️</i></div><div class="field"><div class="pitch"><div class="crease"></div><div class="bowler">🏃</div><div id="ball">●</div><div class="batsman">🏏</div></div><div class="f f1">●</div><div class="f f2">●</div><div class="f f3">●</div><div class="f f4">●</div></div><div id="message">TAP A SHOT WHEN THE BALL REACHES THE BAT</div></section>
<section class="controls"><button data-shot="defend">DEFEND</button><button data-shot="drive">DRIVE</button><button data-shot="pull">PULL</button><button data-shot="loft">LOFT</button></section>
<section class="info"><div>Bowler <b id="bowlerName">J. Bumrah</b></div><div>Speed <b id="speed">138 km/h</b></div><div>Target <b id="target">—</b></div></section>
<footer>Fex Cricket • Original demo • Pakistan 🇵🇰 vs India 🇮🇳</footer></main><script src="game.js"></script></body></html>
