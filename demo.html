<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fex Cricket 3D Shot Demo</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#06100a;font-family:system-ui;color:white}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;font-weight:800}.score{background:#07140ddd;border:1px solid #ffffff22;border-radius:14px;padding:10px 14px}.controls{position:absolute;right:20px;bottom:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:auto}.shot{width:92px;height:64px;border-radius:18px;border:1px solid #ffffff33;background:#0b1c12dd;color:#fff;font-weight:900;font-size:12px}.shot:active{transform:scale(.94);background:#1d5a37}.msg{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#06100ddd;padding:9px 16px;border-radius:20px;font-weight:800;font-size:12px;white-space:nowrap}.speed{position:absolute;left:18px;bottom:24px;background:#06100ddd;padding:10px;border-radius:12px}.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;padding:15px 22px;border:0;border-radius:15px;background:#19a55b;color:white;font-weight:900}.hide{display:none}</style><canvas id=c></canvas><div id=ui><div class=top><div>🏏 FEX CRICKET<br><small>PAK 🇵🇰 vs IND 🇮🇳</small></div><div class=score id=sc>0/0 • 0.0 OV</div></div><button id=start class=start>START  OVER</button><div class=speed id=sp>141 km/h</div><div class=msg id=msg>Wait for the ball…</div><div class=controls><button class=shot data-s=defend>DEFEND</button><button class=shot data-s=drive>DRIVE</button><button class=shot data-s=pull>PULL</button><button class=shot data-s=loft>LOFT</button></div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),sc=document.querySelector('#sc'),msg=document.querySelector('#msg'),sp=document.querySelector('#sp'),start=document.querySelector('#start');let W,H,t=0,ball=null,score=0,w=0,b=0,active=false,hit=false;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function field(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#75c9ec');g.addColorStop(.43,'#6fae52');g.addColorStop(1,'#173e20');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#152a26';x.fillRect(0,H*.30,W,H*.13);for(let i=0;i<9;i++){x.fillStyle=i%2?'#27483d':'#315448';x.fillRect(i*W/9,H*.30,W/9-2,H*.13)}x.fillStyle='#b78d59';x.beginPath();x.moveTo(W*.36,H*.42);x.lineTo(W*.64,H*.42);x.lineTo(W*.70,H);x.lineTo(W*.30,H);x.closePath();x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.fillStyle='#d6b67e';x.fillRect(W*.46,H*.42,W*.08,H*.48)}
function person(px,py,s,shirt){x.fillStyle=shirt;x.beginPath();x.arc(px,py,s*.25,0,7);x.fill();x.fillRect(px-s*.28,py+s*.2,s*.56,s*.55);x.strokeStyle='#111';x.lineWidth=s*.12;x.beginPath();x.moveTo(px-s*.1,py+s*.7);x.lineTo(px-s*.25,py+s);x.moveTo(px+s*.1,py+s*.7);x.lineTo(px+s*.25,py+s);x.stroke()}
function draw(){field();person(W*.50,H*.48,70,'#ef7b31');person(W*.50,H*.78,100,'#16864b');person(W*.16,H*.58,55,'#16864b');person(W*.84,H*.57,55,'#16864b');if(ball){let p=ball.p;let bx=W*.5+(p<.55?(p-.1)*20:0);let by=H*.39+p*H*.42;let r=7+14*p;x.fillStyle='#c51e35';x.beginPath();x.arc(bx,by,r,0,7);x.fill()}requestAnimationFrame(draw)}draw();
function next(){if(b>=6){msg.textContent='OVER COMPLETE — START AGAIN';active=false;return}b++;hit=false;ball={p:0};sp.textContent=(136+Math.floor(Math.random()*11))+' km/h';let begin=performance.now();function fly(now){ball.p=Math.min(1,(now-begin)/1150);if(ball.p<1&&active)requestAnimationFrame(fly);else if(active&&!hit){resolve('defend',true)}}requestAnimationFrame(fly)}
function resolve(kind,miss=false){if(!active||hit)return;hit=true;let r=0,o='';let q=Math.random();if(miss){o='DOT BALL — late shot';}else if(kind==='loft'){if(q<.13){w++;o='WICKET — caught!'}else{r=q<.6?6:4;o=r+'! HUGE SHOT'}}else if(kind==='drive'){if(q<.08){w++;o='WICKET — edge!'}else{r=q<.55?4:q<.8?2:1;o=r===4?'FOUR — cover drive!':r+' RUN'}}else if(kind==='pull'){if(q<.1){w++;o='WICKET — top edge!'}else{r=q<.58?4:q<.72?6:2;o=r===6?'SIX — pulled over midwicket!':r+' RUN'}}else{o=q<.82?'DOT BALL — defended':'1 RUN'}score+=r;sc.textContent=score+'/'+w+' • '+Math.floor(b/6)+'.'+b%6+' OV';msg.textContent=o;if(w>=1){active=false;msg.textContent+='  INNINGS OVER';return}setTimeout(next,900)}
document.querySelectorAll('.shot').forEach(q=>q.onclick=()=>resolve(q.dataset.s));start.onclick=()=>{score=0;w=0;b=0;active=true;start.classList.add('hide');sc.textContent='0/0 • 0.0 OV';msg.textContent='Ball coming…';next()};</script></html>
